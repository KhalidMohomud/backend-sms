services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_PORT: 8080
      POSTGRES_HOST: postgres
      REDIS_ADDR: redis:6379
    ports:
      - "${API_HOST_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kobciye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kobciye}
      POSTGRES_DB: ${POSTGRES_DB:-kobciye}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
