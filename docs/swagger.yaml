info:
  contact: {}
  description: Backend API for Kobciye School.
  title: Kobciye School API
  version: "1.0"
paths:
  /academic-years:
    get:
      parameters:
      - description: Required for SuperAdmin
        in: header
        name: X-School-ID
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.AcademicYear'
            type: array
      security:
      - BearerAuth: []
      summary: List academic years for the resolved school
      tags:
      - foundation
    post:
      consumes:
      - application/json
      parameters:
      - description: Required for SuperAdmin
        in: header
        name: X-School-ID
        type: integer
      - description: Academic year details
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/service.CreateAcademicYearInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.AcademicYear'
      security:
      - BearerAuth: []
      summary: Create an academic year for the resolved school
      tags:
      - foundation
  /academic-years/{id}:
    delete:
      description: Permanently deletes an academic year only when no dependent records
        use it.
      parameters:
      - description: Required for SuperAdmin
        in: header
        name: X-School-ID
        type: integer
      - description: Academic year ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Delete an academic year
      tags:
      - foundation
    get:
      parameters:
      - description: Required for SuperAdmin
        in: header
        name: X-School-ID
        type: integer
      - description: Academic year ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AcademicYear'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Get an academic year by ID
      tags:
      - foundation
    patch:
      consumes:
      - application/json
      parameters:
      - description: Required for SuperAdmin
        in: header
        name: X-School-ID
        type: integer
      - description: Academic year ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/service.UpdateAcademicYearInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AcademicYear'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "401":
